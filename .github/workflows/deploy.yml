name: Deploy na dhosting

# Każdy push do main: build + wgranie dist/ przez FTP(S) na hosting dhosting.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-dhosting
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy przez FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # dhosting zrywa szyfrowane połączenie danych (FTPS pasywny → ECONNRESET),
          # dlatego plain FTP. Uwaga: hasło leci nieszyfrowane — rozważ rotację/SFTP.
          protocol: ftp
          # Katalog docelowy na serwerze — MUSI kończyć się ukośnikiem,
          # np. "/homdu.pl/public_html/" (dokładną ścieżkę sprawdź w panelu dhosting).
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          # Czyści usunięte pliki, ale nie rusza tych spoza projektu.
          dangerous-clean-slate: false
