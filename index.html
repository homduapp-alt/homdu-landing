<!-- i18n core: PL/EN język, trwały + reaktywny przez reload -->
<script>
(function () {
  var l;
  try { l = localStorage.getItem('homdu-lang'); } catch (e) {}
  if (l !== 'en' && l !== 'pl') l = 'pl';
  window.LANG = l;
  document.documentElement.lang = l;
  window.tr = function (pl, en) { return window.LANG === 'en' ? en : pl; };
  window.setLang = function (next) {
    if (next !== 'en' && next !== 'pl') return;
    try { localStorage.setItem('homdu-lang', next); } catch (e) {}
    window.LANG = next;
    window.location.reload();
  };
  document.title = window.tr(
    'homdu — Budowa i remont pod kontrolą. W końcu.',
    'homdu — Your build and renovation, under control. At last.'
  );
  var setMeta = function (sel, val) { var el = document.querySelector(sel); if (el) el.setAttribute('content', val); };
  setMeta('meta[name="description"]', window.tr(
    'Jedna aplikacja na iPhone do prowadzenia budowy domu i remontu mieszkania — etapy, koszty, dokumenty, zdjęcia i poradniki w jednym miejscu. Bezpłatnie.',
    'One iPhone app for running your house build and home renovation — stages, costs, documents, photos and guides in one place. Free.'
  ));
  setMeta('meta[property="og:title"]', window.tr(
    'homdu — Budowa i remont pod kontrolą. W końcu.',
    'homdu — Your build and renovation, under control. At last.'
  ));
  setMeta('meta[property="og:description"]', window.tr(
    'Prowadź budowę lub remont etap po etapie. Budżet, dokumenty, zdjęcia, zadania i kontakty w jednej aplikacji, zamiast w dziesięciu miejscach.',
    'Run your build or renovation stage by stage. Budget, documents, photos, tasks and contacts in one app, instead of ten different places.'
  ));
  setMeta('meta[property="og:locale"]', window.LANG === 'en' ? 'en_US' : 'pl_PL');
})();
</script>

<!-- Motyw: auto-ciemny nocą (Warszawa 22–5) lub zapamiętany wybór — ustawiane przed renderem (bez migotania) -->
<script>
  (function(){try{
    var t=null,h=parseInt(new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Warsaw',hour:'numeric',hour12:false}).format(new Date()),10);
    if(h>=22||h<5){t='dark';}else{var s=localStorage.getItem('homdu-theme');if(s==='light'||s==='dark')t=s;}
    document.documentElement.setAttribute('data-theme',t||'light');
  }catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
