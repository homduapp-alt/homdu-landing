<!-- i18n core: PL/EN język, trwały + reaktywny przez reload -->
<script>
(function () {
  var l;
  try { l = localStorage.getItem('homdu-lang'); } catch (e) {}
  if (l !== 'en' && l !== 'pl') l = 'pl';
  window.LANG = l;
  document.documentElement.lang = l;
  window.tr = function (pl, en) { return window.LANG === 'en' ? en : pl; };
  window.setLang = function (next) {
    if (next !== 'en' && next !== 'pl') return;
    try { localStorage.setItem('homdu-lang', next); } catch (e) {}
    window.LANG = next;
    window.location.reload();
  };
  document.title = window.tr(
    'homdu dla partnerów — Twoja marka tam, gdzie zapada decyzja inwestycyjna',
    'homdu for partners — Your brand where the investment decision is made'
  );
  var setMeta = function (sel, val) { var el = document.querySelector(sel); if (el) el.setAttribute('content', val); };
  setMeta('meta[name="description"]', window.tr(
    'Kontekstowy kanał dotarcia do inwestora budowlanego i remontowego — w momencie, w którym planuje, kupuje i wykonuje. Formaty współpracy dla producentów, banków, ubezpieczycieli i retailu.',
    'A contextual channel to reach the construction and renovation investor — at the moment they plan, buy and build. Partnership formats for manufacturers, banks, insurers and retail.'
  ));
  setMeta('meta[property="og:title"]', window.tr(
    'homdu dla partnerów — Twoja marka w etapie decyzji inwestycyjnej',
    'homdu for partners — Your brand at the investment decision stage'
  ));
  setMeta('meta[property="og:description"]', window.tr(
    'Dotrzyj do inwestora wtedy, kiedy podejmuje decyzje zakupowe. Partner etapu, producenci, poradniki ekspertów, oferty finansowe — formaty współpracy w aplikacji homdu.',
    'Reach the investor when they make purchasing decisions. Stage partner, manufacturers, expert guides, financial offers — partnership formats inside the homdu app.'
  ));
  setMeta('meta[property="og:locale"]', window.LANG === 'en' ? 'en_US' : 'pl_PL');
})();
</script>

<!-- Motyw: auto-ciemny nocą (Warszawa 22–5) lub zapamiętany wybór — ustawiane przed renderem (bez migotania) -->
<script>
  (function(){try{
    var t=null,h=parseInt(new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Warsaw',hour:'numeric',hour12:false}).format(new Date()),10);
    if(h>=22||h<5){t='dark';}else{var s=localStorage.getItem('homdu-theme');if(s==='light'||s==='dark')t=s;}
    document.documentElement.setAttribute('data-theme',t||'light');
  }catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
