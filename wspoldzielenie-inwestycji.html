<!-- i18n core: PL/EN język, trwały + reaktywny przez reload -->
<script>
(function () {
  var l;
  try { l = localStorage.getItem('homdu-lang'); } catch (e) {}
  if (l !== 'en' && l !== 'pl') l = 'pl';
  window.LANG = l;
  document.documentElement.lang = l;
  window.tr = function (pl, en) { return window.LANG === 'en' ? en : pl; };
  window.setLang = function (next) {
    if (next !== 'en' && next !== 'pl') return;
    try { localStorage.setItem('homdu-lang', next); } catch (e) {}
    window.LANG = next;
    window.location.reload();
  };
  document.title = window.tr("Współdzielenie inwestycji — homdu", "Sharing a project — homdu");
  var setMeta = function (sel, val) { var el = document.querySelector(sel); if (el) el.setAttribute('content', val); };
  setMeta('meta[name="description"]', window.tr("Współdziel inwestycję budowlaną lub remont z partnerem albo kierownikiem budowy. Jedna osoba prowadzi, pozostałe widzą te same etapy, koszty i dokumenty — dzięki Apple CloudKit. Bezpłatnie, w ekosystemie Apple.", "Share a building or renovation project with your partner or site manager. One person runs it, the others see the same stages, costs and documents — via Apple CloudKit. Free, in the Apple ecosystem."));
  setMeta('meta[property="og:title"]', window.tr("Współdziel inwestycję przez Apple CloudKit — homdu", "Share your project via Apple CloudKit — homdu"));
  setMeta('meta[property="og:description"]', window.tr("Współdziel inwestycję budowlaną lub remont z partnerem albo kierownikiem budowy. Jedna osoba prowadzi, pozostałe widzą te same etapy, koszty i dokumenty — dzięki Apple CloudKit. Bezpłatnie, w ekosystemie Apple.", "Share a building or renovation project with your partner or site manager. One person runs it, the others see the same stages, costs and documents — via Apple CloudKit. Free, in the Apple ecosystem."));
  setMeta('meta[property="og:locale"]', window.LANG === 'en' ? 'en_US' : 'pl_PL');
})();
</script>

<!-- Motyw: auto-ciemny nocą (Warszawa 22–5) lub zapamiętany wybór -->
<script>
  (function(){try{
    var t=null,h=parseInt(new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Warsaw',hour:'numeric',hour12:false}).format(new Date()),10);
    if(h>=22||h<5){t='dark';}else{var s=localStorage.getItem('homdu-theme');if(s==='light'||s==='dark')t=s;}
    document.documentElement.setAttribute('data-theme',t||'light');
  }catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
